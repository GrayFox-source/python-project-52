<!-- tasks/templates/tasks/create.html -->
{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Создать задачу</h1>
    <form method="post" class="max-w-2xl space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 mt-6">
            Создать
        </button>
    </form>
{% endblock %}
