{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Изменение метки</h1>
    <form method="post" class="max-w-md space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_name" class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
            <input type="text" name="name" id="id_name" 
                   value="{{ form.name.value|default:'' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   required>
            {% if form.name.errors %}
                <p class="mt-1 text-sm text-red-600">{{ form.name.errors }}</p>
            {% endif %}
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 mt-6">
            Изменить
        </button>
    </form>
{% endblock %}
