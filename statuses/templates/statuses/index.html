{% extends 'base.html' %}

{% block content %}
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Статусы</h1>
        <a href="{% url 'statuses:create' %}" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
            Создать статус
        </a>
    </div>

    <table class="min-w-full bg-white border border-gray-200">
        <thead>
            <tr class="bg-gray-100">
                <th class="py-2 px-4 border-b text-left">ID</th>
                <th class="py-2 px-4 border-b text-left">Имя</th>
                <th class="py-2 px-4 border-b text-left">Дата создания</th>
                <th class="py-2 px-4 border-b text-left">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for status in statuses %}
            <tr class="hover:bg-gray-50">
                <td class="py-2 px-4 border-b">{{ status.id }}</td>
                <td class="py-2 px-4 border-b">{{ status.name }}</td>
                <td class="py-2 px-4 border-b">{{ status.created_at|date:"d.m.Y H:i" }}</td>
                <td class="py-2 px-4 border-b space-x-2">
                    <a href="{% url 'statuses:update' status.id %}" class="text-blue-600 hover:underline">Изменить</a>
                    <a href="{% url 'statuses:delete' status.id %}" class="text-red-600 hover:underline">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="py-4 px-4 text-center text-gray-500">Нет статусов</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
