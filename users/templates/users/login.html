{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Авторизация</h1>
    <form method="post" class="max-w-md space-y-4">
        {% csrf_token %}

        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">
                Имя пользователя
            </label>
            <input type="text" name="username" id="id_username"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   required autofocus>
        </div>

        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">
                Пароль
            </label>
            <input type="password" name="password" id="id_password"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   required>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
            Войти
        </button>
    </form>
{% endblock %}
