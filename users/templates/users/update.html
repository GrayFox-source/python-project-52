{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Изменение данных пользователя</h1>
    <form method="post" class="max-w-md space-y-4">
        {% csrf_token %}

        <div>
            <label for="id_first_name" class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
            {{ form.first_name }}
        </div>

        <div>
            <label for="id_last_name" class="block text-sm font-medium text-gray-700 mb-1">Фамилия</label>
            {{ form.last_name }}
        </div>

        <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
            {{ form.username }}
        </div>

        <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
            {{ form.password }}
        </div>

        <div>
            <label for="id_password_confirm" class="block text-sm font-medium text-gray-700 mb-1">Подтверждение пароля</label>
            {{ form.password_confirm }}
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition mt-6">
            Изменить
        </button>
    </form>
{% endblock %}
