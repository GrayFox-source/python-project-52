{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Пользователи</h1>
    
    <table class="min-w-full bg-white border border-gray-200">
        <thead>
            <tr class="bg-gray-100">
                <th class="py-2 px-4 border-b text-left">ID</th>
                <th class="py-2 px-4 border-b text-left">Пользователь</th>
                <th class="py-2 px-4 border-b text-left">Полное имя</th>
                <th class="py-2 px-4 border-b text-left">Дата создания</th>
                <th class="py-2 px-4 border-b text-left">Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr class="hover:bg-gray-50">
                <td class="py-2 px-4 border-b">{{ user.id }}</td>
                <td class="py-2 px-4 border-b">{{ user.username }}</td>
                <td class="py-2 px-4 border-b">{{ user.first_name }} {{ user.last_name }}</td>
                <td class="py-2 px-4 border-b">{{ user.date_joined|date:"d.m.Y H:i" }}</td>
                <td class="py-2 px-4 border-b space-x-2">
                    <a href="{% url 'users:update' user.id %}" class="text-blue-600 hover:underline">Изменить</a>
                    <a href="{% url 'users:delete' user.id %}" class="text-red-600 hover:underline">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
