{% extends 'base.html' %}

{% block content %}
    <h1 class="text-3xl font-bold mb-6">Удаление пользователя</h1>
    <p class="mb-4">Вы уверены, что хотите удалить пользователя "{{ object.username }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Да, удалить</button>
        <a href="{% url 'users:index' %}" class="ml-4 text-gray-600 hover:underline">Отмена</a>
    </form>
{% endblock %}
