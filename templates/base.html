{% load static %}
{% load tailwind_cli %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер задач{% endblock %}</title>

    <!-- Этот тег автоматически подключит скомпилированный CSS -->
    {% tailwind_css %}
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

<nav class="bg-blue-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex flex-wrap items-center justify-between">
        <a href="{% url 'index' %}" class="text-xl font-bold">Менеджер задач</a>

        <div class="flex space-x-4">
            <a href="#" class="hover:underline">Пользователи</a>
            <a href="#" class="hover:underline">Вход</a>
            <a href="#" class="hover:underline">Регистрация</a>
        </div>
    </div>
</nav>

{% if messages %}
    <div class="container mx-auto mt-4">
        {% for message in messages %}
            <div class="p-4 mb-4 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% elif message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}"
                 role="alert">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

<main class="container mx-auto mt-8 flex-grow p-4">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
